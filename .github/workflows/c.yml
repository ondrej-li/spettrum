name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  c-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: clean
      run: make clean
    - name: make
      run: make

  go-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: go vet
      run: make -f Makefile.golang vet
    - name: go build
      run: make -f Makefile.golang build
    - name: go test
      run: make -f Makefile.golang test
    - name: go test -race
      run: make -f Makefile.golang race
