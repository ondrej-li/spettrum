version: 2

project_name: spettrum

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: spettrum
    main: ./cmd/spettrum
    binary: spettrum
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: spettrum
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: third_party/opense-basic/opense.rom
        dst: share/spettrum/opense.rom
      - src: third_party/opense-basic/COPYING
        dst: share/spettrum/opense-basic/COPYING
      - src: third_party/opense-basic/seBasic321.asm
        dst: share/spettrum/opense-basic/seBasic321.asm

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"

nfpms:
  - id: linux-packages
    package_name: spettrum
    vendor: Ondrej Linek
    homepage: https://github.com/ondrej-li/spettrum
    maintainer: Ondrej Linek
    description: |-
      ZX Spectrum emulator with terminal-based display rendering.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: otherosfs
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/spettrum/copyright
      - src: ./third_party/opense-basic/opense.rom
        dst: /usr/share/spettrum/opense.rom
      - src: ./third_party/opense-basic/COPYING
        dst: /usr/share/doc/spettrum/opense-basic/COPYING
      - src: ./third_party/opense-basic/seBasic321.asm
        dst: /usr/share/doc/spettrum/opense-basic/seBasic321.asm
    deb:
      # The emulator runs silently when neither backend is present.
      fields:
        Recommends: libasound2 | libpulse0
    rpm:
      group: Applications/Emulators

release:
  draft: false
  footer: |
    **Full changelog**: https://github.com/ondrej-li/spettrum/compare/{{ .PreviousTag }}...{{ .Tag }}
